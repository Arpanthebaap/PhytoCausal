# Google Cloud Build & Cloud Run Managed Deployment Pipeline
# Target Service: phytocausal (us-central1)

steps:
  # Stage 1: Multi-stage Docker Container Build with embedded invariant proofs
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/phytocausal:latest', '.']

  # Stage 2: Artifact Registry / Container Registry Push
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/phytocausal:latest']

  # Stage 3: Managed Cloud Run Deployment with Zero-Cloud Fallback Architecture
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'phytocausal'
      - '--image'
      - 'gcr.io/$PROJECT_ID/phytocausal:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '3000'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'

images:
  - 'gcr.io/$PROJECT_ID/phytocausal:latest'
